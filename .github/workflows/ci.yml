name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  scaffold-tests:
    name: scaffold tests (no torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run tests (pytest, reports skips)
        run: python -m pytest -q

  # The stack smoke job downloads ~1 GB of wheels and is not part of the default
  # CI path. Trigger it manually before a milestone or when the pins change.
  stack-smoke:
    name: stack import and config smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/stack.txt
          python -m pip install -e ".[dev]"
      - name: Import and configuration checks
        run: python -m pytest tests/test_stack.py -v
