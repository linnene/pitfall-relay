[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitfall-relay"
version = "0.0.1"
description = "Research scaffold for learned execution-time failure experience sharing"
readme = "README.md"
requires-python = ">=3.11"
# The research stack is an optional extra, not a runtime requirement of the package.
# Exact pins live in requirements/stack.txt; see docs/development.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
