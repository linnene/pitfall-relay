<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">PitfallRelay — Experience travels. Mistakes do not have to.</title><desc id="desc">A conceptual illustration: a sender's unsuccessful action becomes an experience card, relayed to a teammate facing a different route. This is a research vision, not an implemented architecture.</desc>
