<text x="49" y="162" fill="#f4f8ff" font-size="68" font-weight="700" letter-spacing="-2">PitfallRelay</text>
<text x="53" y="211" fill="#d5e5fa" font-size="23">Experience travels.</text><text x="53" y="244" fill="#69aaff" font-size="23">Mistakes do not have to.</text>
<text x="53" y="309" fill="#a2b5ce" font-size="15">Execution-time failure experience sharing</text><text x="53" y="333" fill="#a2b5ce" font-size="15">for multi-agent collaboration</text>
<text x="53" y="383" fill="#647d9e" font-size="11" letter-spacing="2">EXPERIENCE / RELEVANCE / TRANSFER</text>
